<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="header">
        <div class="logo">Dashboard</div>
        <div class="user-info">
            <span id="user-name"></span>
            <span id="user-type" class="badge"></span>
            <button id="logout-btn" class="btn btn-secondary">Sair</button>
        </div>
    </div>

    <div class="container">
        <div id="alert-container"></div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="overview">Visão Geral</button>
            <button class="nav-tab" data-tab="entries">Entradas</button>
            <button class="nav-tab" data-tab="register" id="register-tab">Cadastrar</button>
            <button class="nav-tab" data-tab="admin" id="admin-tab" style="display: none;">Admin</button>
        </div>

        <!-- Overview Tab -->
        <div id="overview-tab" class="tab-content">
            <div class="grid grid-3">
                <div class="stat-card">
                    <div class="stat-number" id="total-users">0</div>
                    <div class="stat-label">Total de Usuários</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="total-contracts">0</div>
                    <div class="stat-label">Contratos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="total-revenue">R$ 0</div>
                    <div class="stat-label">Receita Total</div>
                </div>
            </div>

            <div class="card">
                <h3>Gráfico de Usuários por Tipo</h3>
                <div id="users-chart"></div>
            </div>
        </div>

        <!-- Entries Tab -->
        <div id="entries-tab" class="tab-content hidden">
            <div class="card">
                <h3>Entradas do Sistema</h3>
                <div id="entries-table"></div>
            </div>
        </div>

        <!-- Register Tab -->
        <div id="register-tab-content" class="tab-content hidden">
            <div class="card">
                <h3>Cadastrar Novo Usuário</h3>
                <form id="registerUserForm">
                    <div class="grid grid-2">
                        <div class="form-group">
                            <label for="reg-username">Usuário</label>
                            <input type="text" id="reg-username" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="reg-email">Email</label>
                            <input type="email" id="reg-email" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="reg-password">Senha</label>
                            <input type="password" id="reg-password" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="reg-user-type">Tipo de Usuário</label>
                            <select id="reg-user-type" class="form-select" required>
                                <option value="">Selecione o tipo</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="reg-discount">Desconto (%)</label>
                            <input type="number" id="reg-discount" class="form-control" 
                                   min="0" max="100" step="0.01" value="0">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Cadastrar Usuário</button>
                </form>
            </div>
        </div>

        <!-- Admin Tab -->
        <div id="admin-tab-content" class="tab-content hidden">
            <div class="card">
                <h3>Gerenciamento de Usuários</h3>
                <div id="admin-users-table"></div>
            </div>
        </div>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
