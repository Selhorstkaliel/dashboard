<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - LimitClean Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <div class="logo">LimitClean</div>
                <ul class="nav-menu">
                    <li class="nav-item"><a href="/">Dashboard</a></li>
                    <li class="nav-item"><a href="/cadastro.html" class="active">Cadastro</a></li>
                    <li class="nav-item"><a href="/config.html">Configurações</a></li>
                    <li class="nav-item"><a href="/support.html">Suporte</a></li>
                </ul>
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar"></div>
                    <span id="userName">Carregando...</span>
                    <button class="btn btn-secondary btn-sm" onclick="logout()">Sair</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="card">
                <div class="card-header">
                    <h1 class="card-title">Novo Cadastro</h1>
                    <p class="text-muted">Cadastre novos clientes no sistema</p>
                </div>
                <div class="card-body">
                    <form id="cadastroForm" enctype="multipart/form-data">
                        <!-- Tipo de Serviço -->
                        <div class="form-group">
                            <label class="form-label">Tipo de Serviço *</label>
                            <select id="tipo" name="type" class="form-select" required onchange="updatePricing()">
                                <option value="">Selecione o serviço</option>
                                <option value="limpeza">Limpeza</option>
                                <option value="rating_pf">Rating Pessoa Física</option>
                                <option value="rating_pj">Rating Pessoa Jurídica</option>
                            </select>
                        </div>

                        <!-- Tipo de Documento -->
                        <div class="form-group">
                            <label class="form-label">Tipo de Documento *</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input type="radio" id="docCpf" name="doc_type" value="cpf" class="form-check-input" onchange="toggleDocumentType()">
                                    <label for="docCpf" class="form-check-label">CPF (Pessoa Física)</label>
                                </div>
                                <div class="form-check">
                                    <input type="radio" id="docCnpj" name="doc_type" value="cnpj" class="form-check-input" onchange="toggleDocumentType()">
                                    <label for="docCnpj" class="form-check-label">CNPJ (Pessoa Jurídica)</label>
                                </div>
                            </div>
                        </div>

                        <!-- CPF/CNPJ -->
                        <div class="form-group">
                            <label class="form-label" id="docLabel">CPF/CNPJ *</label>
                            <input 
                                type="text" 
                                id="documento" 
                                name="doc" 
                                class="form-control" 
                                placeholder="Digite o CPF ou CNPJ"
                                required
                                onblur="validateDocument()"
                                oninput="formatDocument(this)"
                            >
                            <div id="docValidation" class="text-muted mt-1"></div>
                        </div>

                        <!-- Dados Pessoais -->
                        <h3 class="mt-4 mb-3">Dados Pessoais</h3>
                        
                        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label">Nome Completo *</label>
                                <input type="text" id="nome" name="nome" class="form-control" required placeholder="Nome completo">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Telefone *</label>
                                <input type="tel" id="telefone" name="telefone" class="form-control" required placeholder="(11) 99999-9999" oninput="formatPhone(this)">
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label">E-mail</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="email@exemplo.com">
                            </div>
                            <div class="form-group">
                                <label class="form-label">CEP</label>
                                <input type="text" id="cep" name="cep" class="form-control" placeholder="00000-000" oninput="formatCEP(this)" onblur="buscarCEP()">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Endereço</label>
                            <input type="text" id="endereco" name="endereco" class="form-control" placeholder="Rua, número, bairro">
                        </div>

                        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label">Cidade</label>
                                <input type="text" id="cidade" name="cidade" class="form-control" placeholder="Nome da cidade">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Estado</label>
                                <select id="estado" name="estado" class="form-select">
                                    <option value="">UF</option>
                                    <option value="AC">AC</option>
                                    <option value="AL">AL</option>
                                    <option value="AP">AP</option>
                                    <option value="AM">AM</option>
                                    <option value="BA">BA</option>
                                    <option value="CE">CE</option>
                                    <option value="DF">DF</option>
                                    <option value="ES">ES</option>
                                    <option value="GO">GO</option>
                                    <option value="MA">MA</option>
                                    <option value="MT">MT</option>
                                    <option value="MS">MS</option>
                                    <option value="MG">MG</option>
                                    <option value="PA">PA</option>
                                    <option value="PB">PB</option>
                                    <option value="PR">PR</option>
                                    <option value="PE">PE</option>
                                    <option value="PI">PI</option>
                                    <option value="RJ">RJ</option>
                                    <option value="RN">RN</option>
                                    <option value="RS">RS</option>
                                    <option value="RO">RO</option>
                                    <option value="RR">RR</option>
                                    <option value="SC">SC</option>
                                    <option value="SP">SP</option>
                                    <option value="SE">SE</option>
                                    <option value="TO">TO</option>
                                </select>
                            </div>
                        </div>

                        <!-- Campos específicos para PF -->
                        <div id="pfFields" class="d-none">
                            <h3 class="mt-4 mb-3">Dados Pessoa Física</h3>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div class="form-group">
                                    <label class="form-label">RG</label>
                                    <input type="text" id="rg" name="rg" class="form-control" placeholder="00.000.000-0">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Data de Nascimento</label>
                                    <input type="date" id="dataNascimento" name="data_nascimento" class="form-control">
                                </div>
                            </div>
                        </div>

                        <!-- Campos específicos para PJ -->
                        <div id="pjFields" class="d-none">
                            <h3 class="mt-4 mb-3">Dados Pessoa Jurídica</h3>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div class="form-group">
                                    <label class="form-label">Razão Social</label>
                                    <input type="text" id="razaoSocial" name="razao_social" class="form-control" placeholder="Razão Social da empresa">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Nome Fantasia</label>
                                    <input type="text" id="nomeFantasia" name="nome_fantasia" class="form-control" placeholder="Nome fantasia">
                                </div>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <div class="form-group">
                                    <label class="form-label">Inscrição Estadual</label>
                                    <input type="text" id="inscricaoEstadual" name="inscricao_estadual" class="form-control" placeholder="Inscrição Estadual">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Inscrição Municipal</label>
                                    <input type="text" id="inscricaoMunicipal" name="inscricao_municipal" class="form-control" placeholder="Inscrição Municipal">
                                </div>
                            </div>
                        </div>

                        <!-- Upload de Documentos -->
                        <h3 class="mt-4 mb-3">Documentos</h3>
                        
                        <div class="d-grid" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
                            <!-- Selfie -->
                            <div class="form-group">
                                <label class="form-label">Selfie *</label>
                                <div class="file-upload">
                                    <input type="file" id="selfie" name="attachments" accept="image/*" required>
                                    <label for="selfie" class="file-upload-label">
                                        📷 Clique para enviar selfie
                                    </label>
                                </div>
                            </div>

                            <!-- CNH/RG -->
                            <div class="form-group" id="cnhRgGroup">
                                <label class="form-label" id="cnhRgLabel">CNH ou RG *</label>
                                <div class="file-upload">
                                    <input type="file" id="cnhRg" name="attachments" accept="image/*" required>
                                    <label for="cnhRg" class="file-upload-label">
                                        🆔 Clique para enviar documento
                                    </label>
                                </div>
                            </div>

                            <!-- Documentos PJ -->
                            <div class="form-group d-none" id="docPjGroup">
                                <label class="form-label">Documentos da Empresa</label>
                                <div class="file-upload">
                                    <input type="file" id="docPj" name="attachments" accept="image/*,application/pdf" multiple>
                                    <label for="docPj" class="file-upload-label">
                                        📄 Clique para enviar documentos
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Valores e Vendedor -->
                        <h3 class="mt-4 mb-3">Informações Comerciais</h3>
                        
                        <div class="form-group">
                            <label class="form-label">Vendedor Responsável *</label>
                            <input type="text" id="vendedor" name="vendedor" class="form-control" required placeholder="Nome do vendedor">
                        </div>

                        <div class="d-grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label">Valor Bruto (R$) *</label>
                                <input type="text" id="valorBruto" name="valor_bruto" class="form-control" required placeholder="0,00" oninput="formatCurrency(this); calculateValues();">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Desconto (R$)</label>
                                <input type="text" id="desconto" name="desconto_aplicado" class="form-control" placeholder="0,00" oninput="formatCurrency(this); calculateValues();">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Valor Líquido (R$)</label>
                                <input type="text" id="valorLiquido" name="valor_liquido" class="form-control glow" readonly placeholder="0,00">
                            </div>
                        </div>

                        <!-- Termos e Contrato -->
                        <div class="form-group mt-4">
                            <div class="form-check">
                                <input type="checkbox" id="aceitoTermos" name="generate_contract" value="true" class="form-check-input">
                                <label for="aceitoTermos" class="form-check-label">
                                    Aceito os termos e condições e desejo gerar o contrato em PDF
                                </label>
                            </div>
                        </div>

                        <!-- Botões -->
                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                                <span id="submitText">💾 Salvar Cadastro</span>
                                <div id="submitSpinner" class="spinner d-none"></div>
                            </button>
                            <button type="button" class="btn btn-secondary btn-lg" onclick="clearForm()">
                                🗑️ Limpar Formulário
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">✅ Cadastro Realizado com Sucesso!</h3>
                <button class="modal-close" onclick="closeSuccessModal()">&times;</button>
            </div>
            <div class="modal-body" id="successModalBody">
                <p>O cadastro foi criado com sucesso!</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeSuccessModal()">Fechar</button>
                <button class="btn btn-primary" onclick="newCadastro()">Novo Cadastro</button>
                <button class="btn btn-success" id="downloadContractBtn" onclick="downloadContract()" style="display: none;">
                    📄 Download Contrato
                </button>
            </div>
        </div>
    </div>

    <!-- Error Alert -->
    <div id="errorAlert" class="alert alert-danger d-none" style="position: fixed; top: 20px; right: 20px; z-index: 1001; max-width: 400px;">
        <span id="errorMessage"></span>
    </div>

    <script src="js/common.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
