<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LimitClean Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card fade-in-up">
            <div class="login-header">
                <h1 class="login-logo">LimitClean</h1>
                <p class="text-muted">Dashboard de Gestão</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">Usuário</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        placeholder="Digite seu usuário"
                        required
                        autocomplete="username"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Digite sua senha"
                        required
                        autocomplete="current-password"
                    >
                </div>
                
                <div class="form-check">
                    <input type="checkbox" id="remember" name="remember" class="form-check-input">
                    <label for="remember" class="form-check-label">Lembrar-me</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
                    <span id="loginText">Entrar</span>
                    <div id="loginSpinner" class="spinner d-none"></div>
                </button>
            </form>
            
            <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                <span id="errorMessage"></span>
            </div>
            
            <div id="successAlert" class="alert alert-success d-none" role="alert">
                <span id="successMessage"></span>
            </div>
            
            <div class="text-center mt-3">
                <p class="text-muted">
                    Usuário padrão: <strong>Kaliel</strong><br>
                    Senha padrão: <strong>kaskolk14</strong>
                </p>
            </div>

            <!-- Debug information -->
            <div id="debugInfo" class="text-center mt-3" style="display: none;">
                <small class="text-muted">Debug: <span id="debugText"></span></small>
            </div>
        </div>
    </div>
    
    <script src="js/login.js"></script>
</body>
</html>
